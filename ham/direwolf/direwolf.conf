#
# direwolf.conf - plantilla base para estación APRS portátil
# EDITA los campos marcados con <<< >>> antes de usar.
#

# --- Indicativo y SSID ---
MYCALL EA1JVH

# --- Dispositivo de audio ---
# Con PipeWire/pipewire-pulse, direwolf ve el sistema como si fuera Pulse.
# "pulse" input/output = usa el sink/source por defecto (o el que rutees con pw-link).
ADEVICE pulse pulse

# --- Canal 0: modem 1200 bps AFSK estándar VHF APRS ---
CHANNEL 0
MODEM 1200

# --- IGate (sustituye a YAAC si solo necesitas pasarela, no mapa local) ---
# Regístrate en https://www.aprs-is.net si aún no tienes contraseña IGate.
IGSERVER noam.aprs2.net
IGLOGIN EA1JVH 20897

# --- KISS TNC para Gpredict / otros clientes (puerto TCP local) ---
KISSPORT 8001

# --- AGWPE (compatibilidad con software que lo requiera) ---
AGWPORT 8000

# --- Beacon opcional (descomenta y ajusta si quieres transmitir posición) ---
# PBEACON delay=1 every=30 symbol="/-" overlay=S lat=<<<LAT>>> long=<<<LON>>> comment="Estación portátil"

# --- Logging ---
LOGDIR /home/mgonzalez/sdr-data/direwolf-logs
